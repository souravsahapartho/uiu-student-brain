services:
  db:
    image: postgres:16
    container_name: student_brain_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-student_brain}
      POSTGRES_USER: ${POSTGRES_USER:-student_brain}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rafayet150903}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-student_brain} -d ${POSTGRES_DB:-student_brain}",
        ]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: student_brain_backend
    restart: unless-stopped
    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-django-insecure-jgjok3^26293l*4gus^)&eas*=7ar-djvdktlc^ge%_a=7t=w8}
      DJANGO_DEBUG: ${DJANGO_DEBUG:-True}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-*}
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-student_brain}
      POSTGRES_USER: ${POSTGRES_USER:-student_brain}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rafayet150903}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      AUTO_SEED: ${AUTO_SEED:-true}
    volumes:
      - ./backend:/app
      - ./backend/media:/app/media
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: student_brain_frontend
    restart: unless-stopped
    environment:
      VITE_API_URL: ${VITE_API_URL:-http://localhost:8000/api}
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  pgdata:
  media_data:
